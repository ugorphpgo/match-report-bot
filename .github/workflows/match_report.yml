name: Match Report

on:
  # Основной триггер — внешний cron-job.org, он шлёт repository_dispatch на
  # 23:55 по Минску. Внешний, а не родное расписание GitHub, потому что то
  # может задержаться на десятки минут при высокой нагрузке, а отчёт на
  # завтра нужен до полуночи.
  #
  # Родной cron НЕ включён намеренно: работали бы оба сразу, и отчёт уходил
  # бы дважды за ночь — два сообщения в чат и два коммита в data/.
  # Страховка на случай, если внешний вызов не пришёл, — heartbeat_check.yml:
  # он проверяет, появились ли данные, и запускает прогон только если нет.
  repository_dispatch:
    types: [run-match-report]
  workflow_dispatch:            # ручной запуск из вкладки Actions

permissions:
  contents: write   # нужно, чтобы шаг ниже мог закоммитить data/*.json обратно в репо

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run report script
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u match_report.py

      - name: Commit match data
        run: |
          git config user.name "match-report-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update match data $(date -u +%F)"
          git push