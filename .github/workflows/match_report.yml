name: Match Report

on:
  # Расписание вынесено наружу, в cron-job.org: он шлёт POST на
  # /repos/ugorphpgo/match-report-bot/dispatches с {"event_type":"run-match-report"}
  # в 23:55 Europe/Minsk — отчёт на завтра готов до полуночи.
  # Причина ухода от родного cron GitHub: тот запускается по очереди и при
  # нагрузке уезжает на 10-30 минут вперёд, а здесь до полуночи всего 5 минут.
  # Своего schedule тут больше нет намеренно: с внешним триггером он давал бы
  # два параллельных запуска, которые оба коммитят data/*.json и конфликтуют на push.
  # Прежнее замечание про форк тут неактуально: это исходный репозиторий, не форк,
  # dispatch бьёт ровно в него. При форке надо завести отдельную задачу в cron-job.org.
  # Подстраховка, если внешний триггер не сработает, — heartbeat_check.yml.
  workflow_dispatch:            # ручной запуск из вкладки Actions
  repository_dispatch:
    types: [run-match-report]   # внешний триггер из cron-job.org

permissions:
  contents: write   # нужно, чтобы шаг ниже мог закоммитить data/*.json обратно в репо

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run report script
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u match_report.py

      - name: Commit match data
        run: |
          git config user.name "match-report-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update match data $(date -u +%F)"
          git push